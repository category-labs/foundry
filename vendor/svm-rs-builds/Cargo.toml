[package]
name = "svm-rs-builds"
version = "0.5.25"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Solidity compiler builds"
homepage = "https://github.com/alloy-rs/svm-rs"
repository = "https://github.com/alloy-rs/svm-rs"
build = "build.rs"

[lib]
name = "svm_rs_builds"
path = "src/lib.rs"

[features]
_offline = []

[dependencies]
serde_json = "1.0"

[build-dependencies]
serde_json = "1.0"
svm = { package = "svm-rs", version = "0.5", default-features = false, features = ["blocking", "rustls"] }
